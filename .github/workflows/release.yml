name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: nightcrew-darwin-arm64
          - target: bun-darwin-x64
            asset: nightcrew-darwin-x64
          - target: bun-linux-x64
            asset: nightcrew-linux-x64
          - target: bun-linux-arm64
            asset: nightcrew-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check release version
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - run: bun run --filter @nightcrew/web build
      - name: Compile
        working-directory: apps/cli
        run: |
          bun scripts/embed-web.ts
          bun build src/main.ts --compile --minify --external "chromium-bidi/*" --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}
      - name: Smoke test Linux binary
        if: matrix.target == 'bun-linux-x64'
        run: test "$(apps/cli/dist/${{ matrix.asset }} --version)" = "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: apps/cli/dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Prerelease tags stay prereleases. The installer is advanced only once
        # the new release's binaries are available and verified.
        run: |
          set -euo pipefail
          (cd dist && sha256sum nightcrew-* > SHA256SUMS)
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "NightCrew $GITHUB_REF_NAME" --notes-file release-notes.md $pre
