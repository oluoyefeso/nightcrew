name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx playwright@1.64.0 install --with-deps chromium
      - run: bun test
      - name: Compiled credential-loading smoke check
        run: |
          bun run build
          bun --no-env-file apps/cli/scripts/check-compiled-env.ts apps/cli/dist/nightcrew
      - name: Classic suite
        env:
          GIT_AUTHOR_NAME: NightCrew CI
          GIT_AUTHOR_EMAIL: crew@nightcrew.dev
          GIT_COMMITTER_NAME: NightCrew CI
          GIT_COMMITTER_EMAIL: crew@nightcrew.dev
        run: sudo apt-get install -y bats jq gettext-base && cd classic && bats tests/
